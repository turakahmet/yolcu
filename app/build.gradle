plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace = 'com.islamyolu.app'
    compileSdk = 37

    defaultConfig {
        applicationId = "com.islamyolu.app"
        minSdk = 27
        targetSdk = 36
        versionCode = 20
        versionName = "1.0.20"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        // Room şema JSON'ları app/schemas altına yazılır ve sürüm kontrolüne girer
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_version", "${defaultConfig.versionName}"
        }

        debug {
            resValue "string", "app_version", "${defaultConfig.versionName}.debug"
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding = true
        // AGP 9'da varsayılan kapalı; buildTypes içindeki resValue (app_version) için gerekli
        resValues = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

// Sürümler gradle/libs.versions.toml dosyasından yönetilir
dependencies {
    // --- Temel ve Arayüz (Core & UI) ---
    implementation libs.appcompat
    implementation libs.material
    implementation libs.cardview
    implementation libs.constraintlayout
    implementation libs.work.runtime

    // --- Yerel Veritabanı (Room) ---
    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    // --- Sayfa Geçişleri (Navigation) ---
    implementation libs.navigation.fragment
    implementation libs.navigation.ui

    // --- Ağ İstekleri ve Veri Ayrıştırma ---
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.retrofit.converter.scalars
    implementation libs.gson
    implementation libs.okhttp
    implementation libs.okhttp.logging

    // --- Google Servisleri ---
    implementation libs.play.services.location
    implementation libs.play.review

    // --- Üçüncü Parti Görsel Bileşenler ---
    implementation libs.stepview
    implementation libs.photoview
    implementation libs.glide
    implementation libs.dotsindicator
    implementation libs.ummalqura.calendar

    // --- Test ---
    testImplementation libs.junit
    androidTestImplementation libs.androidx.test.junit
    androidTestImplementation libs.androidx.test.espresso
    androidTestImplementation libs.room.testing
}