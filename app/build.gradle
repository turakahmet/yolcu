plugins {
    id 'com.android.application'
}

android {
    namespace 'com.islamyolu.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.islamyolu.app"
        minSdk 27
        targetSdk 35
        versionCode 7
        versionName "1.0.7"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue "string", "app_version", "${defaultConfig.versionName}"
        }

        debug {
            resValue "string", "app_version", "${defaultConfig.versionName}.debug"
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding = true
    }
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs << "-Xlint:deprecation"
        }
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.navigation:navigation-fragment:2.8.5'
    implementation 'androidx.navigation:navigation-ui:2.8.5'
    //webservis ve loglama
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0' // String olarak çekmek için
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.5.0'

    implementation 'org.jsoup:jsoup:1.14.3'
    implementation 'com.squareup.okhttp3:okhttp:4.9.1'

    implementation 'com.google.android.gms:play-services-location:21.3.0'
//soruların step olarak gosterimi
    implementation 'com.github.shuhart:stepview:1.5.1'
// namaz saatleri icin
    implementation 'com.batoulapps.adhan:adhan2:0.0.5'

    implementation 'androidx.work:work-runtime:2.10.0'

    // uygulama puanlama icin
    implementation 'com.google.android.play:review:2.0.2'

    implementation 'com.github.chrisbanes:PhotoView:2.3.0'

    //resimler icin
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    //intro indicator icin
    implementation 'com.tbuonomo:dotsindicator:5.0'

    //hicri takvim icin
    implementation 'com.github.msarhan:ummalqura-calendar:2.0.2'


    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}