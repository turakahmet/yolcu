name: Namaz vakitleri güncelle

on:
  schedule:
    # Her gün 03:17 (TR). Bot 150 dk içinde eskiyen şehirleri yeniler; yenilenecek şehir
    # yoksa birkaç saniyede biter ve e-posta göndermez. GitHub zamanlamada gecikebilir.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "auto: gerekiyorsa yer listesi + vakitler | places: sadece yer listesi | times: sadece vakitler"
        type: choice
        options: [auto, places, times]
        default: auto
      country_ids:
        description: "Boş = tüm ülkeler. Test için ülke id'leri, ör. 2 (Türkiye) veya 2,13"
        default: ""
      daily_limit:
        description: "Bu çalışmada en fazla kaç şehir (boş = sınırsız, süre sınırı geçerli)"
        default: ""

permissions:
  contents: write

concurrency:
  group: prayer-times
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Bağımlılıkları kur
        id: deps
        run: |
          test -s requirements.txt || { echo "requirements.txt bulunamadı veya boş"; exit 1; }
          pip install -r requirements.txt

      - name: Mevcut yayını al (gh-pages)
        id: fetch_site
        run: |
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null; then
            git clone --depth 1 --branch gh-pages \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
            rm -rf site/.git
          else
            mkdir -p site
          fi

      - name: Botu çalıştır
        id: bot
        timeout-minutes: 165
        env:
          DIYANET_EMAIL: ${{ secrets.DIYANET_EMAIL }}
          DIYANET_PASSWORD: ${{ secrets.DIYANET_PASSWORD }}
          MODE: ${{ inputs.mode || 'auto' }}
          COUNTRY_IDS: ${{ inputs.country_ids || '' }}
          DAILY_LIMIT: ${{ inputs.daily_limit || '' }}
          MAX_RUN_MINUTES: "150"
          SITE_DIR: site
          REPORT_FILE: report.json
        run: |
          set -o pipefail
          python -u bot/pry_bot.py 2>&1 | tee bot.log

      # Bot hata verse ya da zaman aşımına uğrasa bile o ana kadar çekilen veri yayımlanır.
      # Geçerli veri yoksa (ör. klonlama başarısız olduysa) mevcut yayını silmemek için atlanır.
      - name: Yayınla (tek commit, force push; git geçmişi şişmez)
        id: publish
        if: always()
        run: |
          if [ ! -s site/v2/cities.json ] || [ ! -s site/v2/index.json ]; then
            echo "Yayımlanacak geçerli v2 verisi yok; mevcut yayına dokunulmadı."
            exit 0
          fi
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Veri güncellemesi $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

      # Başarılıysa kısa özet, değilse ayrıntılı teşhis + log eki. Yenilenecek şehir yoksa
      # zamanlanmış çalışmada e-posta gönderilmez; elle çalıştırmada her zaman gönderilir.
      - name: Rapor e-postası gönder
        if: always()
        env:
          SMTP_USER: ${{ secrets.GMAIL_USER }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          NOTIFY_NOTHING_TO_DO: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          DEPS_OUTCOME: ${{ steps.deps.outcome }}
          FETCH_OUTCOME: ${{ steps.fetch_site.outcome }}
          BOT_OUTCOME: ${{ steps.bot.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          REPORT_FILE: report.json
          BOT_LOG: bot.log
          SITE_DIR: site
        run: python3 bot/send_report.py
